<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI City — a city without money</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>

  <header id="top">
    <div class="brand"><span class="logo">🏙️</span><div><b>AI City</b><small>a city without money, run by an AI</small></div></div>
    <div class="clock" id="clock"><span id="clock-ico">☀️</span><b id="clock-time">--:--</b><small id="clock-day">day –</small></div>
    <div class="kpis" id="kpis"></div>
    <div class="top-actions">
      <button id="btn-left" class="icon" title="Government & statistics">🏛️</button>
      <button id="btn-report" class="icon" title="Post-mortem report">📜</button>
      <button id="btn-orbit" class="icon" title="Auto-rotate">🎥</button>
      <button id="btn-reset" class="icon" title="Reset camera">🧭</button>
      <button id="btn-right" class="icon" title="Citizens">👥</button>
    </div>
  </header>

  <aside id="left" class="panel">
    <section>
      <h3>🏛️ Government <span id="gov-badge" class="badge"></span></h3>
      <div id="gov-analysis" class="muted">Waiting for the first decision…</div>
      <div id="gov-policy" class="chips"></div>
      <div id="gov-announce"></div>
    </section>
    <section>
      <h3>📦 Depot</h3>
      <div id="depot"></div>
    </section>
    <section>
      <div class="tabs" id="chart-tabs">
        <button data-c="hunger" class="on">Hunger</button><button data-c="food">Food</button><button data-c="equality">Equality</button><button data-c="health">Health</button>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>
    <section>
      <h3>🧠 Jev engine</h3>
      <div id="llm"></div>
    </section>
    <section>
      <h3>Legend</h3>
      <div class="legend">
        <span><i style="background:#3b82f6"></i>Idle</span><span><i style="background:#f59e0b"></i>Working</span>
        <span><i style="background:#22c55e"></i>Eating</span><span><i style="background:#ef4444"></i>Hungry</span>
        <span><i style="background:#8b95a5"></i>Deceased</span><span>🟣 sick</span>
      </div>
    </section>
  </aside>

  <aside id="right" class="panel">
    <div id="inspector" hidden></div>
    <div id="citizen-list">
      <h3>👥 Citizens <span id="pop-count" class="badge"></span></h3>
      <input id="search" placeholder="Search by name or job…" />
      <div id="list"></div>
    </div>
  </aside>

  <footer id="feed-wrap">
    <div class="feed-head">
      <b>Live log</b>
      <div id="filters" class="chips"></div>
    </div>
    <div id="feed"></div>
  </footer>

  <div id="extinct-banner" hidden></div>
  <div id="report-modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h2 id="report-title">📜 City report</h2><button class="x" id="report-close">✕</button></div>
      <div id="report-body"><p class="muted">Loading…</p></div>
      <div class="modal-foot">
        <button class="btn" id="report-refresh">🔄 Regenerate</button>
        <button class="btn danger" id="report-reset">♻️ Reset city</button>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div><p>Connecting to the city…</p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
